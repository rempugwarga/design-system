name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Diperlukan untuk npm Trusted Publishing (provenance via OIDC) sehingga
  # TIDAK ada token registry yang disimpan sebagai secret.
  id-token: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Build package (dist untuk publish)
        run: bun run build
      - name: Create release PR atau publish paket
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore: release @rempugwarga/design-system"
          title: "chore: release @rempugwarga/design-system"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Provenance ditandatangani melalui OIDC; aktifkan Trusted Publisher
          # untuk package ini di registry. Jika registry belum mendukung,
          # sediakan NPM_TOKEN melalui GitHub Environment (bukan di repo).
          NPM_CONFIG_PROVENANCE: "true"
